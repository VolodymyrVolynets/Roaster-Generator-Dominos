name: CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/volodymyrvolynets/roaster-generator-dominos
  FRONTEND_IMAGE_NAME: ghcr.io/volodymyrvolynets/roaster-frontend

jobs:
  build-and-push:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Roaster Generator/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push React frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${POSTGRES_PASSWORD:-}" ]; then
            echo "GitHub secret POSTGRES_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "${ADMIN_USERNAME:-}" ]; then
            echo "GitHub secret ADMIN_USERNAME is not configured."
            exit 1
          fi

          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "GitHub secret ADMIN_PASSWORD is not configured."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"

          # Normalize Windows CRLF line endings before OpenSSH reads the key.
          printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/deploy_key" \
            compose.prod.yaml \
            "$VPS_USER@$VPS_HOST:/opt/roaster-generator/compose.prod.yaml"

          env_file="$RUNNER_TEMP/roaster-generator.env"
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" > "$env_file"
          printf 'ADMIN_USERNAME=%s\n' "$ADMIN_USERNAME" >> "$env_file"
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" >> "$env_file"
          chmod 600 "$env_file"

          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/deploy_key" \
            "$env_file" \
            "$VPS_USER@$VPS_HOST:/opt/roaster-generator/.env.tmp"

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/deploy_key" \
            "$VPS_USER@$VPS_HOST" \
            'set -e
             chmod 600 /opt/roaster-generator/.env.tmp
             mv /opt/roaster-generator/.env.tmp /opt/roaster-generator/.env
             docker network inspect roaster-generator_default >/dev/null 2>&1 || docker network create roaster-generator_default
             cd /opt/roaster-generator &&
             docker compose -f compose.prod.yaml pull &&
             docker compose -f compose.prod.yaml up -d --remove-orphans &&
             docker compose -f compose.prod.yaml ps'
